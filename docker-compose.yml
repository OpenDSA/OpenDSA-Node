services:
  backend:
    env_file:
      - path: ./apps/backend/.env
        required: false
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    command: npm run dev:backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/web/node_modules
      # Stands in for the k8s emptyDir in 40-backend-deployment.yaml: the
      # book-compile config handoff is written under config/temp in here.
      - ./.opendsa-shared:/mnt/opendsa-shared
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mysql://root:secret@mysql:3306/lti_db
      # Same shared-dir path as k8s. The API link differs: in k8s the
      # opendsa sidecar is in the same Pod (http://localhost:8080/...),
      # here it is a separate container, so use the compose service name.
      - OPENDSA_SHARED_DIR=/mnt/opendsa-shared
      - CONFIG_API_LINK=http://opendsa:8080/api/configure/
      # The Vite dev server on :5173 is the local equivalent of the k8s
      # ingress: it proxies /api to the backend and the book/static paths
      # to opendsa. Use :5173 as the public origin for local LTI URLs and
      # generated book links.
      - BOOKS_PUBLIC_URL=https://toolbar-dealers-disposition-excuse.trycloudflare.com/Books
    depends_on:
      mysql:
        condition: service_healthy
      opendsa:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    command: npm run dev:web
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/web/node_modules
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://backend:3000
      - BOOKS_PROXY_TARGET=http://opendsa:8080
    depends_on:
      backend:
        condition: service_healthy
      opendsa:
        condition: service_healthy

  # OpenDSA book compiler/serving container. Same runtime as the k8s image
  # built from k8s/opendsa/Dockerfile.discovery (that is Dockerfile.server
  # plus COPY . .), except the source is bind-mounted for local development
  # instead of baked in.
  opendsa:
    build:
      context: ${OPENDSA_SRC:-../OpenDSA-DevStack/opendsa}
      dockerfile: Dockerfile.server
    # Distinct tag so this never clobbers DevStack's opendsa/opendsa:latest.
    image: opendsa/opendsa:dev
    ports:
      # Stands in for the /Books Ingress path in 60-ingress.yaml.
      - "8080:8080"
    volumes:
      - ${OPENDSA_SRC:-../OpenDSA-DevStack/opendsa}:/opendsa
      # Use the same scoped Flask app as the k8s image so local serving and
      # /healthz match production. This overrides the upstream app.py.
      - ./k8s/opendsa/app.py:/opendsa/app.py:ro
      # Equivalent of the sidecar's subPath mount: only config/temp is
      # shared with the backend, so opendsa's prebuilt config/*.json
      # templates (and the rest of config/) stay visible.
      - ./.opendsa-shared/config/temp:/opendsa/config/temp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: lti_db
    volumes:
      # Persists database data across container restarts
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
