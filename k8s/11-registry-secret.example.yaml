# Template for the image-pull credential against VT GitLab's container registry.
#
# Easiest way to generate the real secret is NOT to hand-edit this file (the
# .dockerconfigjson auth value must be base64-encoded "user:token"), but to run:
#
#   kubectl create secret docker-registry opendsa-registry \
#     --docker-server=container.cs.vt.edu \
#     --docker-username=<gitlab-access-token-name> \
#     --docker-password=<gitlab-access-token-value> \
#     --namespace=91762f26-opendsanode \
#     --dry-run=client -o yaml > k8s/11-registry-secret.yaml
#
# Token must be a GitLab Project Access Token on the git.cs.vt.edu project backing
# this repo, role Maintainer, scope read_registry.
#
# k8s/11-registry-secret.yaml is gitignored - never commit the real secret.
apiVersion: v1
kind: Secret
metadata:
  name: opendsa-registry
  namespace: 91762f26-opendsanode
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: __GENERATE_VIA_KUBECTL_COMMAND_ABOVE__
