apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opendsa
  namespace: 91762f26-opendsanode
  # Uncomment the annotations block below to allow off-campus/non-VPN access
  # (opens the Ingress to ALL traffic - see k8s/README.md for the tradeoff
  # before enabling):
  # annotations:
  #   nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
spec:
  ingressClassName: nginx
  rules:
    - host: 91762f26-opendsanode.discovery.cs.vt.edu
      http:
        paths:
          # /api and /Books listed before / - Express/opendsa expect their
          # path prefix intact, no rewrite-target annotation here.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          # Routed straight to the opendsa sidecar (not through web/nginx) -
          # see k8s/40-backend-deployment.yaml. Scoped to /Books specifically,
          # not /, since opendsa's Flask app has a catch-all static-file
          # route off its own working directory - a wide-open path would
          # also expose things like its app.py and Makefile.
          - path: /Books
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
