apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opendsa
  namespace: 91762f26-opendsanode
  # Off-campus/non-VPN access enabled at stakeholder request (opens the
  # Ingress to ALL traffic, not just VT - see k8s/README.md for the
  # tradeoff). Comment this back out + reapply to lock it back down.
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
spec:
  ingressClassName: nginx
  rules:
    - host: 91762f26-opendsanode.discovery.cs.vt.edu
      http:
        paths:
          # /api and /Books listed before / - Express/opendsa expect their
          # path prefix intact, no rewrite-target annotation here.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          # Routed straight to the opendsa sidecar, scoped to just the
          # paths it needs to serve - see "served content scoping" in
          # k8s/README.md for why these six specifically.
          - path: /Books
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /AV
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /DataStructures
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /lib
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /Exercises
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /khan-exercises
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          # scoped to inlineav specifically, not all of /Metadata - that
          # dir also has our build scripts in it
          - path: /Metadata/inlineav
            pathType: Prefix
            backend:
              service:
                name: opendsa
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
