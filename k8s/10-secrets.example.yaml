# Template for DB credentials used by MySQL, the migration Job, and the backend.
#
# Copy this file to 10-secrets.yaml, fill in real values, then:
#   kubectl apply -f k8s/10-secrets.yaml -n __NAMESPACE__
#
# 10-secrets.yaml is gitignored - never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: opendsa-db-credentials
  namespace: __NAMESPACE__
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: __CHANGE_ME__
  MYSQL_DATABASE: lti_db
  # Hostname "mysql" is the ClusterIP Service name (k8s/22-mysql-service.yaml),
  # not "localhost" like the docker-compose dev setup. Keep the password here
  # in sync with MYSQL_ROOT_PASSWORD above.
  DATABASE_URL: mysql://root:__CHANGE_ME__@mysql:3306/lti_db
