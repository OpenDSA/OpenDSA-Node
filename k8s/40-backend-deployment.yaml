apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: 91762f26-opendsanode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: opendsa-registry
      containers:
        - name: backend
          image: container.cs.vt.edu/jaden/opendsa-node/backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opendsa-db-credentials
                  key: DATABASE_URL
          # Only /api/health is wired to probes - a transient DB hiccup
          # shouldn't crash-loop an otherwise-healthy Express process.
          # Check /api/health/db manually (see k8s/README.md) instead.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
