# Copy to 12-auth-secret.yaml (gitignored), fill values privately, then apply.
# Create this Secret before deploying the updated backend.
apiVersion: v1
kind: Secret
metadata:
  name: opendsa-auth
  namespace: 91762f26-opendsanode
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  SESSION_SECRET: __GENERATE_RANDOM_VALUE_AT_LEAST_32_CHARACTERS__
  # Must match the value used to hash accounts in this database.
  # Leave empty only if those passwords were created without a pepper.
  PASSWORD_PEPPER: ""
